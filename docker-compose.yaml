services:
  app:
    # USER_ID drives the tag: psp:<username> for dev builds, psp:svc for the
    # release copy (flipped by #RELEASE:USER_ID=svc at release time).
    image: psp:${USER_ID}
    build:
      context: .
      # Host identity comes from .env so this file stays host-agnostic and the
      # dev and staging branches can share it. See .env.example.
      args:
        DOCKER_GID: ${DOCKER_GID}
        UID_0: ${UID_0}
        UID_1: ${UID_1}
        UID_2: ${UID_2}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Intentionally unset in .env: empty -> entrypoint.sh defaults to svc,
      # so ONE place decides the production identity. Dev runs pass it on the
      # command line. ':-' silences the compose WARN.
      RUN_USER: ${RUN_USER:-}
      # Passthrough for smoke runs: SKIP_SFTP=1 on the host command line makes
      # inv_feed_sync fetch + write CSVs without touching the vendor SFTP.
      # Compose forwards only declared vars, so without this line the flag
      # silently never reaches the container (verified the hard way).
      SKIP_SFTP: ${SKIP_SFTP:-}
      NPM_CONFIG_CACHE: /tmp/.npm
      # Pin the local PG container. .env carries a commented-out Azure PROD
      # block whose keys feed the same `PGHOST || PG_HOST` fallback in both
      # pools; these pins mean an accidental uncomment can never repoint a
      # containerized run at production (monday precedent).
      PGHOST: pg_db
      PGPORT: "5432"
      PG_SSLMODE: require
    working_dir: /workspace
    volumes:
      # Project source - live edits on host reflect in container. node_modules
      # is IN-TREE (installed by build.sh as the host user), so it rides along
      # in this mount — the shared /opt/resources/node_mod_cache mount is
      # retired; each copy (dev clone, release) owns its own deps.
      - ./:/workspace

      # Run logs. Host side is env-dependent and DEFAULTS TO THE DEV PATH so a
      # missing LOG_DIR fails safe (never writes into /opt/run-logs); the
      # release .env flips it via #RELEASE:LOG_DIR. The container path is
      # fixed and matches APP_NAME=part_source_pipeline (underscore) because
      # the logger writes to /opt/run-logs/${APP_NAME}/ (utils/logger/log.js);
      # the host dir follows the repo name (hyphen) — intentional.
      - ${LOG_DIR:-./utils/logger/logs}:/opt/run-logs/part_source_pipeline
    networks:
      - pg_net

networks:
  pg_net:
    external: true
